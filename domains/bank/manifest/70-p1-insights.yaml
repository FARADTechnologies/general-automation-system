id: analytics.spend_by_category
title: Spending by category
llm_description: >
  Total spending per category for a period, calculated by the bank. Use for "how much did I spend
  on X" and spending breakdowns. Figures are exact; quote them, do not recalculate.
kind: read
risk: R0
derived: true
input_schema:
  type: object
  properties:
    period: { type: string, enum: [last_7_days, last_30_days, last_90_days, this_month, last_month] }
  required: [period]
  additionalProperties: false
request:
  method: GET
  path: /internal/v3/cust/{ctx.cust_id}/txn/agg
  query: { prd: "{input.period}", grp: ctgry, dir: DR, ccy: AZN }
response:
  items: items
  extra:
    period_from: "{raw.frm_dt}"
    period_to: "{raw.to_dt}"
    total_spent: "{raw.ttl_minor|major}"
    currency: "{raw.ccy}"
  fields:
    category: { from: key, map: { GROC: groceries, DINE: dining, TRNS: transport, SHOP: shopping, HLTH: health, SUBS: subscriptions, ENTM: entertainment, UTIL: utilities, MOBL: mobile, P2P: transfers to people } }
    amount: { from: ttl_minor, transform: major }
    transactions: cnt
ui:
  route: /app/analytics
---
id: analytics.compare_periods
title: Compare spending between two periods
llm_description: >
  Compare spending between two periods, overall and per category, calculated by the bank
  (difference and percentage change included). Quote the figures; do not recalculate.
kind: read
risk: R0
derived: true
input_schema:
  type: object
  properties:
    period_a: { type: string, enum: [last_7_days, last_30_days, this_month, last_month, previous_7_days, previous_30_days] }
    period_b: { type: string, enum: [last_7_days, last_30_days, this_month, last_month, previous_7_days, previous_30_days] }
  required: [period_a, period_b]
  additionalProperties: false
request:
  method: GET
  path: /internal/v3/cust/{ctx.cust_id}/txn/cmp
  query: { prd_a: "{input.period_a}", prd_b: "{input.period_b}", grp: ctgry, dir: DR, ccy: AZN }
response:
  items: items
  extra:
    period_a_total: "{raw.a.ttl_minor|major}"
    period_b_total: "{raw.b.ttl_minor|major}"
    difference: "{raw.diff_minor|major}"
    percent_change: "{raw.pct_chg}"
    currency: "{raw.ccy}"
  fields:
    category: { from: key, map: { GROC: groceries, DINE: dining, TRNS: transport, SHOP: shopping, HLTH: health, SUBS: subscriptions, ENTM: entertainment, UTIL: utilities, MOBL: mobile, P2P: transfers to people } }
    period_a: { from: a_minor, transform: major }
    period_b: { from: b_minor, transform: major }
    difference: { from: diff_minor, transform: major }
ui:
  route: /app/analytics
---
id: analytics.top_expenses
title: Largest expenses
llm_description: >
  The largest single expenses in a period, largest first.
kind: read
risk: R0
derived: true
input_schema:
  type: object
  properties:
    period: { type: string, enum: [last_7_days, last_30_days, last_90_days, this_month, last_month] }
    limit: { type: integer, minimum: 1, maximum: 10 }
  required: [period]
  additionalProperties: false
request:
  method: GET
  path: /internal/v3/cust/{ctx.cust_id}/txn/top
  query: { prd: "{input.period}", lmt: "{input.limit|default:5}", ccy: AZN }
response:
