id: subscription.cancel.prepare
title: Prepare cancelling a subscription
llm_description: >
  Prepare cancelling one card subscription. The customer confirms with one tap on the bank screen.
  The subscription must be a token from subscriptions.list.
kind: prepare
risk: R2
input_schema:
  type: object
  properties:
    subscription: { type: string, description: "Subscription token from subscriptions.list" }
  required: [subscription]
  additionalProperties: false
intent_terms: [cancel, stop, unsubscribe, end, remove, terminate, rid, drop, discontinue, quit, delete]
critical_args:
  subscription: { token: subscription, provenance: [bank_record] }
request:
  method: POST
  path: /internal/v3/sbscr/cncl_req
  body:
    cust_id: "{ctx.cust_id}"
    sbscr_ref: "{args.subscription}"
    idmp_key: "{ctx.idempotency_key}"
result:
  ref: op_id
  merchant: data.mrch_nm
  amount: { from: data.amt_minor, transform: major }
  currency: data.ccy
commit: { method: POST, path: "/internal/v3/op/{result.ref}/aply" }
cancel: { method: POST, path: "/internal/v3/op/{result.ref}/cncl" }
postcondition:
  method: GET
  path: /internal/v3/cust/{ctx.cust_id}/sbscr/{args.subscription}
  expect: { sts_cd: CNL }
confirm:
  level: tap
  title: Cancel subscription
  display:
    - { key: merchant, label: Subscription, value: "{result.merchant}" }
    - { key: amount, label: Monthly charge, value: "{result.amount|money:result.currency}" }
    - { key: effect, label: Effect, value: "No further charges from this merchant on your card." }
errors:
  SBSCR_INACTIVE: { code: ALREADY_CANCELLED, message: "This subscription is already cancelled." }
ui:
  say:
    start: "I'm preparing to cancel {merchant}."
    done: "Done. {merchant} is cancelled."
  route: /app/subscriptions
---
id: bills.pay_all.prepare
title: Prepare paying all unpaid bills at once
llm_description: >
  Prepare paying every unpaid bill in one batch with a single confirmation. The bank calculates
  the total. Nothing is paid until the customer confirms on the bank screen.
kind: prepare
risk: R3
input_schema:
  type: object
  properties: {}
  additionalProperties: false
intent_terms: [pay, bills, bill, settle, utilities, everything]
lookups:
  source:
    method: GET
    path: /internal/v3/cust/{ctx.cust_id}/acct
    items: items
    where: { ccy: AZN, acct_typ_cd: CUR }
request:
  method: POST
  path: /internal/v3/pmt/btch
  body:
    cust_id: "{ctx.cust_id}"
    src_acct_no: "{lookup.source.acct_no}"
    idmp_key: "{ctx.idempotency_key}"
result:
  ref: op_id
  total: { from: data.ttl_minor, transform: major }
  count: data.itm_cnt
  bills: data.blr_list
commit: { method: POST, path: "/internal/v3/op/{result.ref}/aply" }
cancel: { method: POST, path: "/internal/v3/op/{result.ref}/cncl" }
postcondition:
  method: GET
  path: /internal/v3/op/{result.ref}
  expect: { sts_cd: DONE }
confirm:
  level: biometric
  title: Pay all unpaid bills
  display:
    - { key: bills, label: Bills, value: "{result.bills}" }
    - { key: count, label: Number of bills, value: "{result.count}" }
    - { key: amount, label: Total, value: "{result.total|money:AZN}" }
    - { key: fee, label: Fee, value: "0.00 AZN" }
    - { key: source_account, label: From, value: "{lookup.source.acct_nm} •••• {lookup.source.acct_no|last4}" }
errors:
  NO_UNPAID: { code: NOTHING_TO_PAY, message: "There are no unpaid bills." }
ui:
  say:
    start: "I'm preparing all {count} bills, {amount} in total."
    done: "Done. All your bills are paid."
  route: /app/bills
