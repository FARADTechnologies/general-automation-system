risk: R2
input_schema:
  type: object
  properties:
    card: { type: string, description: "Card token from cards.list" }
    branch: { type: string, description: "Branch token from branches.list" }
  required: [card, branch]
  additionalProperties: false
intent_terms: [replace, replacement, reissue, order, new, another]
critical_args:
  card: { token: card, provenance: [bank_record] }
  branch: { token: branch, provenance: [bank_record] }
request:
  method: POST
  path: /internal/v3/crd/rplc_req
  body:
    cust_id: "{ctx.cust_id}"
    crd_pan: "{args.card}"
    brnch_cd: "{args.branch}"
    idmp_key: "{ctx.idempotency_key}"
result:
  ref: op_id
  card_name: data.crd_nm
  card_last4: { from: data.crd_pan, transform: last4 }
  branch: data.brnch_nm
  ready: data.rdy_dt
commit: { method: POST, path: "/internal/v3/op/{result.ref}/aply" }
cancel: { method: POST, path: "/internal/v3/op/{result.ref}/cncl" }
postcondition:
  method: GET
  path: /internal/v3/op/{result.ref}
  expect: { sts_cd: DONE }
confirm:
  level: tap
  title: Order a replacement card
  display:
    - { key: card, label: Card, value: "{result.card_name} •••• {result.card_last4}" }
    - { key: branch, label: Pickup branch, value: "{result.branch}" }
    - { key: ready, label: Ready from, value: "{result.ready}" }
    - { key: fee, label: Fee, value: "0.00 AZN" }
errors:
  VIRTUAL: { code: VIRTUAL_CARD, message: "Virtual cards cannot be delivered to a branch." }
ui:
  route: /app/cards
---
id: transfer.recurring.prepare
title: Prepare a recurring transfer
llm_description: >
  Prepare a standing order: a fixed amount to a saved contact every month or every week. Contact
  from contacts.search. The first payment is tomorrow unless the user named a start. Pass what the
  user said and let the bank work out the date: start_weekday for a weekday ("every Friday",
  "starting next Monday"); start_day for a day of the month ("on the 5th", "from the 1st"), plus
  start_month when the user named or implied a month ("1 December", "the 1st of next month").
  Never compute a date yourself; the bank screen shows the first payment date to the customer.
kind: prepare
risk: R3
input_schema:
  type: object
  properties:
    contact: { type: string, description: "Contact token from contacts.search" }
    amount: { type: number }
    currency: { type: string, enum: [AZN] }
    frequency: { type: string, enum: [monthly, weekly] }
    start_weekday: { type: string, enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday], description: "Only if the user named a weekday for the payments or the first payment" }
    start_day: { type: integer, minimum: 1, maximum: 28, description: "Only if the user named a day of the month" }
    start_month: { type: integer, minimum: 1, maximum: 12, description: "Only with start_day, if the user named or implied a month" }
  required: [contact, amount, currency, frequency]
  additionalProperties: false
intent_terms: [every, monthly, weekly, recurring, schedule, standing, each, automatic, regularly]
critical_args:
  contact: { token: contact, provenance: [resolved_contact] }
  amount: { provenance: [user_stated] }
lookups:
  source:
    method: GET
    path: /internal/v3/cust/{ctx.cust_id}/acct
    items: items
    where: { ccy: "{input.currency}", acct_typ_cd: CUR }
policy:
  limit_group: transfer
  amount: "{input.amount}"
  currency: "{input.currency}"
request:
  method: POST
  path: /internal/v3/so/drft
  body:
    cust_id: "{ctx.cust_id}"
    src_acct_no: "{lookup.source.acct_no}"
    bnfcry_ref: "{args.contact}"
    amt_minor: "{input.amount|minor}"
    ccy: "{input.currency}"
    freq_cd: "{input.frequency|initial}"
    strt_wkdy: "{input.start_weekday}"
    strt_dom: "{input.start_day}"
    strt_mon: "{input.start_month}"
    idmp_key: "{ctx.idempotency_key}"
result:
  ref: op_id
  payee_name: data.bnfcry_nm
  start: data.strt_lbl
commit: { method: POST, path: "/internal/v3/op/{result.ref}/aply" }
cancel: { method: POST, path: "/internal/v3/op/{result.ref}/cncl" }
postcondition:
  method: GET
  path: /internal/v3/op/{result.ref}
  expect: { sts_cd: DONE }
confirm:
  level: biometric
  title: Recurring transfer
  display:
    - { key: payee_name, label: To, value: "{result.payee_name}" }
    - { key: amount, label: Amount, value: "{input.amount|money:input.currency}" }
    - { key: frequency, label: Every, value: "{input.frequency}" }
    - { key: start, label: First payment, value: "{result.start}" }
    - { key: source_account, label: From, value: "{lookup.source.acct_nm} •••• {lookup.source.acct_no|last4}" }
ui:
  route: /app/transfers/recurring
---
id: split.calculate
title: Split an amount
llm_description: >
  Split an amount equally between a number of people (including the user if they say so).
  The bank calculates each share; use the share it returns.
kind: read
risk: R0
derived: true
input_schema:
  type: object
  properties:
    amount: { type: number }
    people: { type: integer, minimum: 2, maximum: 20 }
  required: [amount, people]
  additionalProperties: false
request:
  method: GET
  path: /internal/v3/calc/split
  query: { amt_minor: "{input.amount|minor}", n: "{input.people}" }
response:
  fields:
    total: { from: ttl_minor, transform: major }
    people: n
    share: { from: shr_minor, transform: major }
    remainder: { from: rmndr_minor, transform: major }
ui:
  route: /app/transfers
