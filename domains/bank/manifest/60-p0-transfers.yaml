id: templates.list
title: Saved templates
llm_description: >
  List the customer's saved payment templates (name, type, payee and amount). Use a template
  token with transfer.template.prepare when the user refers to a template by name.
kind: read
risk: R0
input_schema:
  type: object
  properties: {}
  additionalProperties: false
request:
  method: GET
  path: /internal/v3/cust/{ctx.cust_id}/tmpl
response:
  items: items
  fields:
    template:
      from: tmpl_ref
      token: { kind: template, provenance: template, masked: "{item.tmpl_nm}", label: "{item.tmpl_nm}" }
    name: tmpl_nm
    type: { from: tmpl_typ, map: { P2P: transfer, BLL: bill, TOPUP: mobile_topup } }
    payee: pye_nm
    amount: { from: amt_minor, transform: major }
    currency: ccy
ui:
  route: /app/transfers
---
id: transfer.template.prepare
title: Prepare a transfer from a saved template
llm_description: >
  Prepare the transfer stored in a saved template (payee and amount come from the template).
  Only templates of type transfer. Nothing moves until the customer confirms.
kind: prepare
risk: R3
input_schema:
  type: object
  properties:
    template: { type: string, description: "Template token from templates.list" }
  required: [template]
  additionalProperties: false
intent_terms: [send, pay, transfer, rent, template, usual]
critical_args:
  template: { token: template, provenance: [template] }
lookups:
  tmpl:
    method: GET
    path: /internal/v3/cust/{ctx.cust_id}/tmpl
    items: items
    where: { tmpl_ref: "{args.template}", tmpl_typ: P2P }
    error: { code: NOT_A_TRANSFER_TEMPLATE, message: "That template is not a transfer template." }
  source:
    method: GET
    path: /internal/v3/cust/{ctx.cust_id}/acct
    items: items
    where: { ccy: "{lookup.tmpl.ccy}", acct_typ_cd: CUR }
policy:
  limit_group: transfer
  amount: "{lookup.tmpl.amt_minor|major}"
  currency: "{lookup.tmpl.ccy}"
request:
  method: POST
  path: /internal/v3/pmt/drft
  body:
    cust_id: "{ctx.cust_id}"
    src_acct_no: "{lookup.source.acct_no}"
    dst_typ_cd: BNF
    dst_ref: "{lookup.tmpl.bnfcry_ref}"
    amt_minor: "{lookup.tmpl.amt_minor}"
    ccy: "{lookup.tmpl.ccy}"
    chnl_cd: AGT
    idmp_key: "{ctx.idempotency_key}"
result:
  ref: drft_id
  fee: { from: fee_minor, transform: major }
  payee_name: dst_nm
commit: { method: POST, path: "/internal/v3/pmt/{result.ref}/post" }
cancel: { method: POST, path: "/internal/v3/pmt/{result.ref}/cncl" }
postcondition:
  method: GET
  path: /internal/v3/pmt/{result.ref}
  expect: { sts_cd: POSTED }
confirm:
  level: biometric
  title: Template transfer
  display:
    - { key: template, label: Template, value: "{lookup.tmpl.tmpl_nm}" }
    - { key: payee_name, label: To, value: "{result.payee_name}" }
    - { key: amount, label: Amount, value: "{lookup.tmpl.amt_minor|major|money:lookup.tmpl.ccy}" }
    - { key: fee, label: Fee, value: "{result.fee|money:lookup.tmpl.ccy}" }
    - { key: source_account, label: From, value: "{lookup.source.acct_nm} •••• {lookup.source.acct_no|last4}" }
ui:
  say:
    start: "I'm using your {template} template for {amount}."
    done: "Done. {amount} has been sent to {payee_name}."
  route: /app/transfers/contact
  form: transfer
  fields:
    - { target: transfer-recipient, display: payee_name }
    - { target: transfer-amount, display: amount }
    - { target: transfer-source, display: source_account }
  submit: transfer-continue
---
id: card.unblock.prepare
title: Prepare unblocking a card
llm_description: >
  Prepare unblocking (unfreezing) a blocked card. This weakens security, so the customer confirms
  with fingerprint or PIN on the bank screen. The card must be a token from cards.list.
kind: prepare
risk: R3
input_schema:
  type: object
  properties:
    card: { type: string, description: "Card token from cards.list" }
  required: [card]
  additionalProperties: false
intent_terms: [unblock, unfreeze, unlock, reactivate, activate, enable, restore]
critical_args:
  card: { token: card, provenance: [bank_record] }
lookups:
  card:
    method: GET
    path: /internal/v3/cust/{ctx.cust_id}/crd
    items: items
    where: { crd_pan: "{args.card}" }
request:
  method: POST
  path: /internal/v3/crd/chg_req
  body:
    cust_id: "{ctx.cust_id}"
    crd_pan: "{args.card}"
    new_sts_cd: A
    rsn_cd: CUST
    idmp_key: "{ctx.idempotency_key}"
result:
  ref: req_id
commit: { method: POST, path: "/internal/v3/crd/chg_req/{result.ref}/aply" }
cancel: { method: POST, path: "/internal/v3/crd/chg_req/{result.ref}/cncl" }
postcondition:
  method: GET
  path: /internal/v3/cust/{ctx.cust_id}/crd/{args.card}
  expect: { crd_sts_cd: A }
confirm:
  level: biometric
  title: Unblock card
  display:
    - { key: card, label: Card, value: "{lookup.card.crd_nm} •••• {lookup.card.crd_pan|last4}" }
    - { key: effect, label: Effect, value: "Card payments and withdrawals work again." }
errors:
  CRD_STS_SAME: { code: ALREADY_ACTIVE, message: "This card is already active." }
ui:
  say:
    start: "I'm preparing to unblock your card {card}."
    done: "Done. Your card {card} is active again."
  route: /app/cards
  fields: []
---
