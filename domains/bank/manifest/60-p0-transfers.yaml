id: card.unblock.prepare
title: Prepare unblocking a card
llm_description: >
  Prepare unblocking (unfreezing) a blocked card. This weakens security, so the customer confirms
  with fingerprint or PIN on the bank screen. The card must be a token from cards.list.
kind: prepare
risk: R3
input_schema:
  type: object
  properties:
    card: { type: string, description: "Card token from cards.list" }
  required: [card]
  additionalProperties: false
intent_terms: [unblock, unfreeze, unlock, reactivate, activate, enable, restore]
critical_args:
  card: { token: card, provenance: [bank_record] }
lookups:
  card:
    method: GET
    path: /internal/v3/cust/{ctx.cust_id}/crd
    items: items
    where: { crd_pan: "{args.card}" }
request:
  method: POST
  path: /internal/v3/crd/chg_req
  body:
    cust_id: "{ctx.cust_id}"
    crd_pan: "{args.card}"
    new_sts_cd: A
    rsn_cd: CUST
    idmp_key: "{ctx.idempotency_key}"
result:
  ref: req_id
commit: { method: POST, path: "/internal/v3/crd/chg_req/{result.ref}/aply" }
cancel: { method: POST, path: "/internal/v3/crd/chg_req/{result.ref}/cncl" }
postcondition:
  method: GET
  path: /internal/v3/cust/{ctx.cust_id}/crd/{args.card}
  expect: { crd_sts_cd: A }
confirm:
  level: biometric
  title: Unblock card
  display:
    - { key: card, label: Card, value: "{lookup.card.crd_nm} •••• {lookup.card.crd_pan|last4}" }
    - { key: effect, label: Effect, value: "Card payments and withdrawals work again." }
errors:
  CRD_STS_SAME: { code: ALREADY_ACTIVE, message: "This card is already active." }
ui:
  route: /app/cards
  fields: []
---
id: topup.mobile.prepare
title: Prepare a mobile top-up
llm_description: >
  Prepare topping up a mobile number with Azercell, Bakcell or Nar. The phone must be the tel_
  reference from the user's message. For the customer's own Bakcell number use topup.own.prepare.
kind: prepare
risk: R3
input_schema:
  type: object
  properties:
    operator: { type: string, enum: [Azercell, Bakcell, Nar] }
    phone: { type: string, description: "tel_ reference from the user's message" }
    amount: { type: number }
  required: [operator, phone, amount]
  additionalProperties: false
intent_terms: [top, topup, recharge, load, credit, refill]
critical_args:
  phone: { token: phone, provenance: [ingress_token] }
  amount: { provenance: [user_stated, derived] }
lookups:
  source:
    method: GET
    path: /internal/v3/cust/{ctx.cust_id}/acct
    items: items
    where: { ccy: AZN, acct_typ_cd: CUR }
policy:
  limit_group: topup
  amount: "{input.amount}"
  currency: AZN
request:
  method: POST
  path: /internal/v3/pmt/drft
  body:
    cust_id: "{ctx.cust_id}"
    src_acct_no: "{lookup.source.acct_no}"
    dst_typ_cd: TOPUP
    dst_ref: "{input.operator|upper}:{args.phone|local_msisdn}"
    amt_minor: "{input.amount|minor}"
    ccy: AZN
    chnl_cd: AGT
    idmp_key: "{ctx.idempotency_key}"
result:
  ref: drft_id
commit: { method: POST, path: "/internal/v3/pmt/{result.ref}/post" }
cancel: { method: POST, path: "/internal/v3/pmt/{result.ref}/cncl" }
postcondition:
  method: GET
  path: /internal/v3/pmt/{result.ref}
  expect: { sts_cd: POSTED }
confirm:
  level: biometric
  title: Mobile top-up
  display:
    - { key: operator, label: Operator, value: "{input.operator}" }
    - { key: masked_destination, label: Number, value: "{input.phone|masked}" }
    - { key: amount, label: Amount, value: "{input.amount|money:AZN}" }
    - { key: source_account, label: From, value: "{lookup.source.acct_nm} •••• {lookup.source.acct_no|last4}" }
errors:
  TOPUP_INV: { code: INVALID_NUMBER, message: "That is not a valid mobile number for this operator." }
ui:
  route: /app/payments
---
id: topup.own.prepare
title: Prepare a top-up of the customer's own number
llm_description: >
  Prepare topping up the customer's own mobile number saved in the "My Bakcell" template.
  The user must state the amount, or say to use the template's amount.
