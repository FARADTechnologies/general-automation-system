id: transfer.own.prepare
title: Prepare a transfer between own accounts
llm_description: >
  Prepare moving money between two of the customer's own accounts in the same currency
  (for example main account to savings). Both accounts are tokens from accounts.list.
  Nothing moves until the customer confirms on the bank screen.
kind: prepare
risk: R3
input_schema:
  type: object
  properties:
    from_account: { type: string, description: "Account token to take the money from" }
    to_account: { type: string, description: "Account token to put the money into" }
    amount: { type: number, description: "Amount in major units, as the user stated it" }
    currency: { type: string, enum: [AZN, USD] }
  required: [from_account, to_account, amount, currency]
  additionalProperties: false
intent_terms: [move, transfer, put, send, save, savings, shift, deposit, withdraw]
critical_args:
  amount: { provenance: [user_stated, derived] }
  to_account: { token: account, provenance: [bank_record] }
  from_account: { token: account, provenance: [bank_record] }
lookups:
  source:
    method: GET
    path: /internal/v3/cust/{ctx.cust_id}/acct
    items: items
    where: { acct_no: "{args.from_account}", ccy: "{input.currency}" }
    error: { code: CURRENCY_MISMATCH, message: "The source account is not in that currency." }
  dest:
    method: GET
    path: /internal/v3/cust/{ctx.cust_id}/acct
    items: items
    where: { acct_no: "{args.to_account}", ccy: "{input.currency}" }
    error: { code: CURRENCY_MISMATCH, message: "The destination account is not in that currency; cross-currency moves are not available." }
request:
  method: POST
  path: /internal/v3/pmt/drft
  body:
    cust_id: "{ctx.cust_id}"
    src_acct_no: "{args.from_account}"
    dst_typ_cd: ACCT
    dst_ref: "{args.to_account}"
    amt_minor: "{input.amount|minor}"
    ccy: "{input.currency}"
    chnl_cd: AGT
    idmp_key: "{ctx.idempotency_key}"
result:
  ref: drft_id
commit: { method: POST, path: "/internal/v3/pmt/{result.ref}/post" }
cancel: { method: POST, path: "/internal/v3/pmt/{result.ref}/cncl" }
postcondition:
  method: GET
  path: /internal/v3/pmt/{result.ref}
  expect: { sts_cd: POSTED }
confirm:
  level: biometric
  title: Move between my accounts
  display:
    - { key: source_account, label: From, value: "{lookup.source.acct_nm} •••• {lookup.source.acct_no|last4}" }
    - { key: destination, label: To, value: "{lookup.dest.acct_nm} •••• {lookup.dest.acct_no|last4}" }
    - { key: amount, label: Amount, value: "{input.amount|money:input.currency}" }
    - { key: fee, label: Fee, value: "0.00 {input.currency}" }
errors:
  SAME_ACCT: { code: SAME_ACCOUNT, message: "Source and destination are the same account." }
ui:
  route: /app/transfers/own
---
id: transfer.card.prepare
title: Prepare a transfer to a card number
llm_description: >
  Prepare a transfer to a card number the user typed or said. The card must be the pan_ reference
  that replaced the number in the user's message. Transfers to other banks' cards have a fee.
  Nothing moves until the customer confirms on the bank screen.
kind: prepare
risk: R3
input_schema:
  type: object
  properties:
    card: { type: string, description: "pan_ reference from the user's message" }
    amount: { type: number }
    currency: { type: string, enum: [AZN] }
  required: [card, amount, currency]
  additionalProperties: false
intent_terms: [send, transfer, pay, give, wire, move]
critical_args:
  card: { token: pan, provenance: [ingress_token] }
  amount: { provenance: [user_stated, derived] }
lookups:
  source:
    method: GET
    path: /internal/v3/cust/{ctx.cust_id}/acct
    items: items
    where: { ccy: "{input.currency}", acct_typ_cd: CUR }
policy:
  limit_group: transfer
  amount: "{input.amount}"
  currency: "{input.currency}"
  new_payee: "true"
  balance: "{lookup.source.avail_bal_minor|major}"
request:
  method: POST
  path: /internal/v3/pmt/drft
  body:
    cust_id: "{ctx.cust_id}"
    src_acct_no: "{lookup.source.acct_no}"
    dst_typ_cd: PAN
    dst_ref: "{args.card}"
    amt_minor: "{input.amount|minor}"
    ccy: "{input.currency}"
    chnl_cd: AGT
    idmp_key: "{ctx.idempotency_key}"
result:
  ref: drft_id
  fee: { from: fee_minor, transform: major }
  payee_name: dst_nm
commit: { method: POST, path: "/internal/v3/pmt/{result.ref}/post" }
cancel: { method: POST, path: "/internal/v3/pmt/{result.ref}/cncl" }
postcondition:
  method: GET
  path: /internal/v3/pmt/{result.ref}
  expect: { sts_cd: POSTED }
confirm:
  level: biometric
  title: Transfer to a card
  display:
    - { key: payee_name, label: To, value: "{result.payee_name}" }
    - { key: masked_destination, label: Card, value: "{input.card|masked}" }
    - { key: amount, label: Amount, value: "{input.amount|money:input.currency}" }
    - { key: fee, label: Fee, value: "{result.fee|money:input.currency}" }
    - { key: source_account, label: From, value: "{lookup.source.acct_nm} •••• {lookup.source.acct_no|last4}" }
ui:
  route: /app/transfers/contact
  form: transfer
  fields:
    - { target: transfer-recipient, display: masked_destination }
    - { target: transfer-amount, display: amount }
    - { target: transfer-source, display: source_account }
  submit: transfer-continue
---
