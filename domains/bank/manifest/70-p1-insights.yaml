id: payment.request.prepare
title: Prepare payment requests to contacts
llm_description: >
  Prepare asking one or more saved contacts to pay the user the same amount each (for example
  their share of a bill). Contacts from contacts.search; the amount is what the user stated or
  the share from split.calculate. The customer confirms with one tap.
kind: prepare
risk: R2
input_schema:
  type: object
  properties:
    contacts: { type: array, items: { type: string }, description: "Contact tokens from contacts.search" }
    amount: { type: number, description: "Amount each contact is asked to pay" }
    note: { type: string, maxLength: 60 }
  required: [contacts, amount]
  additionalProperties: false
intent_terms: [request, split, ask, collect, owe, back, share, charge]
critical_args:
  contacts: { token: contact, provenance: [resolved_contact] }
  amount: { provenance: [user_stated, derived] }
request:
  method: POST
  path: /internal/v3/rtp/drft
  body:
    cust_id: "{ctx.cust_id}"
    bnfcry_refs: "{args.contacts}"
    amt_minor: "{input.amount|minor}"
    ccy: AZN
    note: "{input.note}"
    idmp_key: "{ctx.idempotency_key}"
result:
  ref: op_id
  who: data.who
commit: { method: POST, path: "/internal/v3/op/{result.ref}/aply" }
cancel: { method: POST, path: "/internal/v3/op/{result.ref}/cncl" }
postcondition:
  method: GET
  path: /internal/v3/op/{result.ref}
  expect: { sts_cd: DONE }
confirm:
  level: tap
  title: Request money
  display:
    - { key: payee_name, label: From, value: "{result.who}" }
    - { key: amount, label: Amount each, value: "{input.amount|money:AZN}" }
    - { key: note, label: Note, value: "{input.note}" }
ui:
  route: /app/transfers
