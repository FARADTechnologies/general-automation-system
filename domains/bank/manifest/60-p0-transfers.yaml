  type: object
  properties:
    amount: { type: number, description: "Amount the user stated, or the template amount if the user asked for it" }
  required: [amount]
  additionalProperties: false
intent_terms: [top, topup, recharge, load, credit, refill]
critical_args:
  amount: { provenance: [user_stated, derived, template] }
lookups:
  tmpl:
    method: GET
    path: /internal/v3/cust/{ctx.cust_id}/tmpl
    items: items
    where: { tmpl_typ: TOPUP }
    error: { code: NO_OWN_NUMBER, message: "No own mobile number is saved." }
  source:
    method: GET
    path: /internal/v3/cust/{ctx.cust_id}/acct
    items: items
    where: { ccy: AZN, acct_typ_cd: CUR }
policy:
  limit_group: topup
  amount: "{input.amount}"
  currency: AZN
request:
  method: POST
  path: /internal/v3/pmt/drft
  body:
    cust_id: "{ctx.cust_id}"
    src_acct_no: "{lookup.source.acct_no}"
    dst_typ_cd: TOPUP
    dst_ref: "{lookup.tmpl.blr_cd}:{lookup.tmpl.sbscr_no}"
    amt_minor: "{input.amount|minor}"
    ccy: AZN
    chnl_cd: AGT
    idmp_key: "{ctx.idempotency_key}"
result:
  ref: drft_id
commit: { method: POST, path: "/internal/v3/pmt/{result.ref}/post" }
cancel: { method: POST, path: "/internal/v3/pmt/{result.ref}/cncl" }
postcondition:
  method: GET
  path: /internal/v3/pmt/{result.ref}
  expect: { sts_cd: POSTED }
confirm:
  level: biometric
  title: Top up my number
  display:
    - { key: operator, label: Operator, value: "{lookup.tmpl.pye_nm}" }
    - { key: masked_destination, label: Number, value: "•••{lookup.tmpl.sbscr_no|last4}" }
    - { key: amount, label: Amount, value: "{input.amount|money:AZN}" }
    - { key: source_account, label: From, value: "{lookup.source.acct_nm} •••• {lookup.source.acct_no|last4}" }
ui:
  route: /app/payments
