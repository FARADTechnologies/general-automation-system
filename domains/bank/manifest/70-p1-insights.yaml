id: subscriptions.list
title: Subscriptions
llm_description: >
  List the customer's card subscriptions with merchant, monthly amount, next charge date and status.
kind: read
risk: R0
input_schema:
  type: object
  properties: {}
  additionalProperties: false
request:
  method: GET
  path: /internal/v3/cust/{ctx.cust_id}/sbscr
response:
  items: items
  fields:
    subscription:
      from: sbscr_ref
      token: { kind: subscription, provenance: bank_record, masked: "{item.mrch_nm}", label: "{item.mrch_nm}" }
    merchant: mrch_nm
    amount: { from: amt_minor, transform: major }
    currency: ccy
    next_charge: nxt_chrg_dt
    status: { from: sts_cd, map: { ACT: active, CNL: cancelled } }
    card_last4: { from: crd_pan, transform: last4 }
ui:
  route: /app/subscriptions
